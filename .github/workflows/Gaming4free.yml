name: Gaming4free Auto Renew

on:
  repository_dispatch:
    types: [run-renew]  # 接收名为 run-renew 的外部信号
  workflow_dispatch:    # 依然保留手动触发按钮

permissions:
  contents: write
  actions: write        # 新增：允许操作 Actions 运行记录的权限

jobs:
  run_renewal:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies for PyAutoGUI/Xvfb
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-tk python3-dev xvfb x11-utils scrot

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade --no-cache-dir seleniumbase undetected-chromedriver requests pyautogui

    - name: Setup Chrome
      run: |
        seleniumbase install chromedriver

    - name: Setup Proxy Tunnel (Xray-core)
      env:
        XRAY_CONFIG: ${{ secrets.XRAY_CONFIG }} 
      run: |
        wget -q https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
        unzip -q Xray-linux-64.zip -d xray
        chmod +x xray/xray
        
        printenv XRAY_CONFIG > xray/config.json
        
        nohup ./xray/xray run -c xray/config.json > xray.log 2>&1 &
        sleep 5
        
        if ! pgrep -x "xray" > /dev/null; then
            echo "❌ Xray 进程未启动或已崩溃！查看报错日志："
            cat xray.log
            exit 1
        fi
        
        curl -il -x socks5://127.0.0.1:10808 https://api.ipify.org || (echo "❌ 代理测试失败，查看 Xray 日志:" && cat xray.log && exit 1)

    - name: Run Script
      env:
        PROXY: socks5://127.0.0.1:10808
        TG_TOKEN: ${{ secrets.TG_TOKEN }}      
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}  
        SERVERS: ${{ secrets.SERVERS }}  
      run: |
        xvfb-run --server-args="-screen 0 1280x720x24" -a python gaming4free.py

    - name: 🧽 清理进程和临时文件
      if: always()
      run: |
        pkill -f xray || true
        pkill -f chromedriver || true
        pkill -f chrome || true
        pkill -f Xvfb || true
        rm -rf xray xray.log xray-linux-64.zip || true

    - name: 🧹 清理旧的工作流运行记录
      if: always()
      env:
        GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
      run: |
        runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
        count=0
        for run_id in $runs; do
          count=$((count + 1))
          if [ $count -gt 1 ]; then
            echo "删除运行记录: $run_id"
            gh run delete $run_id || true
          fi
        done
